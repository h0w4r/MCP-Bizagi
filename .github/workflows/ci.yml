name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    # Never run unreviewed public contributions on an operator's native-engine machine.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore pinned dependencies
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/McpBizagi.Core.Tests -c Release --no-build --logger trx
      - name: Package integrity policy tests (no native engine)
        run: ./tests/package-verifier.Tests.ps1
      - name: Reviewed dependency license policy tests
        run: ./tests/dependency-license.Tests.ps1
      - name: Real MCP XML acceptance (native engine not installed)
        run: dotnet run --project tests/McpBizagi.Acceptance -c Release --no-build -- .
